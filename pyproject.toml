[project]
name = "morpheus-mcp"
version = "0.2.0"
description = "Send chat and embedding requests to Morpheus, a decentralized AI inference network, through api.mor.org or your own Uplink."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "ABSGrafx", email = "devs@absgrafx.com" },
]
keywords = ["morpheus", "mcp", "inference", "openai-compatible", "decentralized", "uplink"]
dependencies = [
  # Exact pins: `uvx --from git+...` ignores uv.lock, so these bound what an install resolves.
  "mcp==1.30.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/absgrafx/morpheus-grok-mcp#readme"
Repository = "https://github.com/absgrafx/morpheus-grok-mcp"
Issues = "https://github.com/absgrafx/morpheus-grok-mcp/issues"

[project.scripts]
morpheus-mcp = "morpheus_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morpheus_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/morpheus_mcp",
  "skills",
  "docs",
  ".cursor-plugin",
  "schemas",
  "scripts",
  "assets",
  "mcp.json",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
