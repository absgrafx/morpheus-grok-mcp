[project]
name = "morpheus-mcp"
version = "0.1.0"
description = "Morpheus MoE via api.mor.org or private Uplink — Marketplace MCP for Grok Bot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "NomadicRogue / ABSGrafx", email = "trinity@absgrafx.com" },
]
keywords = ["morpheus", "mcp", "openai-compatible", "moe", "uplink", "inference"]
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/absgrafx/morpheus-grok-mcp"
Repository = "https://github.com/absgrafx/morpheus-grok-mcp"
Issues = "https://github.com/absgrafx/morpheus-grok-mcp/issues"

[project.scripts]
morpheus-mcp = "morpheus_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morpheus_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/morpheus_mcp",
  "skills",
  "docs",
  "plugin.json",
  "mcp.json",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
