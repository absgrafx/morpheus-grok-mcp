[project]
name = "morpheus-mcp"
version = "0.2.0"
description = "Run chat and embeddings on Morpheus decentralized inference (api.mor.org or your own Uplink)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "ABSGrafx", email = "devs@absgrafx.com" },
]
keywords = ["morpheus", "mcp", "inference", "openai-compatible", "decentralized", "uplink"]
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/absgrafx/morpheus-grok-mcp#readme"
Repository = "https://github.com/absgrafx/morpheus-grok-mcp"
Issues = "https://github.com/absgrafx/morpheus-grok-mcp/issues"

[project.scripts]
morpheus-mcp = "morpheus_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morpheus_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/morpheus_mcp",
  "skills",
  "docs",
  ".cursor-plugin",
  "schemas",
  "scripts",
  "assets",
  "mcp.json",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
